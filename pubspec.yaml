name: zettask
description: "Zettask - Aplikasi manajemen tugas harian minimalis dan modern."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_ui: ^1.1.7
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.6
  path: ^1.9.1
  intl: ^0.20.3
  google_fonts: ^9.0.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  device_calendar_plus: ^0.12.0
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#FAFAFA"
  color_dark: "#0A0A0A"
  image: assets/splash/splash_icon_light.png
  image_dark: assets/splash/splash_icon_dark.png
  android_12:
    color: "#FAFAFA"
    color_dark: "#0A0A0A"
    icon_background_color: "#FAFAFA"
    icon_background_color_dark: "#0A0A0A"
    image: assets/splash/splash_icon_light.png
    image_dark: assets/splash/splash_icon_dark.png
  ios: false
  web: false
